<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💳 Gastos — Control Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d17;
    --surface: #13131f;
    --surface2: #1a1a2a;
    --border: #1e1e2e;
    --border2: #2a2a3a;
    --text: #f0f0f0;
    --muted: #888;
    --dim: #555;
    --dimmer: #444;
    --red: #e8534a;
    --orange: #e8a23a;
    --yellow: #e8cf4a;
    --green: #4ac49e;
    --blue: #4a9ee8;
    --purple: #9b6ee8;
    --pink: #e86ea0;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
  input, select, button { font-family: 'DM Sans', sans-serif; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input::placeholder { color: #3a3a4a; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

  #app { max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }

  /* ── Topbar ── */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 20px 20px 0; }
  .topbar-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--red), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .topbar-name { font-weight: 800; font-size: 16px; }
  .topbar-sub { font-size: 10px; color: var(--dim); letter-spacing: 0.05em; }
  .topbar-spacer { flex: 1; }
  .btn-small { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 11px; cursor: pointer; }
  .btn-small:active { opacity: 0.7; }

  /* ── Onboarding ── */
  .onboard { padding: 28px 20px; }
  .step-dots { display: flex; gap: 6px; margin-bottom: 20px; }
  .step-dot { flex: 1; height: 3px; border-radius: 99px; background: var(--border); transition: background 0.4s; }
  .step-dot.active { background: var(--red); }
  .step-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .step-sub { font-size: 13px; color: var(--dim); margin-bottom: 28px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
  .input-wrap { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; overflow: hidden; }
  .input-wrap:focus-within { border-color: var(--red); }
  .input-euro { padding: 0 12px; color: var(--dim); font-size: 14px; }
  .input-wrap input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; padding: 12px 12px 12px 0; font-family: 'DM Mono', monospace; }

  .plain-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 14px; outline: none; }
  .plain-input:focus { border-color: var(--red); }
  select.plain-input { cursor: pointer; }

  .extra-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn-add-extra { width: 100%; background: var(--surface); border: 1px dashed var(--border2); color: var(--muted); border-radius: 10px; padding: 10px; cursor: pointer; font-size: 13px; margin-bottom: 10px; }
  .btn-add-extra:active { opacity: 0.7; }

  .chip { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .chip-name { font-size: 13px; color: #ddd; }
  .chip-cat { font-size: 11px; color: var(--dim); margin-left: 8px; }
  .chip-right { display: flex; align-items: center; gap: 10px; }
  .chip-amount { font-family: monospace; color: var(--red); font-size: 14px; }
  .chip-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; }

  .section-divider { border-top: 1px solid var(--border); margin: 10px 0 16px; padding-top: 16px; }
  .section-label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }

  .nav-row { display: flex; gap: 10px; margin-top: 24px; }
  .btn-back { flex: 1; background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); border-radius: 12px; padding: 14px; font-size: 14px; cursor: pointer; }
  .btn-next { flex: 2; background: var(--red); border: none; color: white; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
  .btn-next:disabled { opacity: 0.4; cursor: default; }
  .btn-next:not(:disabled):active { opacity: 0.8; }

  /* ── Dashboard ── */
  .dash { padding: 24px 20px; }
  .balance-block { margin-bottom: 24px; }
  .balance-label { font-size: 11px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .balance-amount { font-size: 36px; font-weight: 800; font-family: 'DM Mono', monospace; margin-top: 4px; }
  .balance-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px; }
  .card-label { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .card-amount { font-size: 18px; font-weight: 700; font-family: monospace; }
  .card-pct { font-size: 10px; color: var(--dimmer); margin-top: 3px; }

  .semaforo { background: var(--surface); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
  .semaforo-emoji { font-size: 22px; }
  .semaforo-msg { font-size: 13px; font-weight: 600; }
  .semaforo-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }

  .tabs { display: flex; background: var(--surface); border-radius: 10px; padding: 4px; margin-bottom: 20px; gap: 4px; }
  .tab { flex: 1; background: transparent; border: none; color: var(--dim); border-radius: 8px; padding: 8px 4px; font-size: 11px; cursor: pointer; font-weight: 400; transition: all 0.2s; }
  .tab.active { background: var(--border); color: var(--text); font-weight: 600; }

  .barra-item { margin-bottom: 10px; }
  .barra-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
  .barra-track { background: var(--surface); border-radius: 99px; height: 6px; overflow: hidden; }
  .barra-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

  .regla-label { font-size: 11px; color: var(--dimmer); text-align: center; margin-top: 20px; margin-bottom: 10px; }
  .regla-grid { display: flex; gap: 8px; }
  .regla-cell { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .regla-rec { font-size: 10px; color: var(--dim); }
  .regla-real { font-size: 16px; font-weight: 700; margin-top: 2px; }

  .empty-tab { color: var(--dim); text-align: center; margin-top: 20px; font-size: 13px; }

  /* ── Backup bar ── */
  .backup-bar { display: flex; gap: 8px; margin-top: 28px; }
  .btn-backup { flex: 1; background: var(--surface); border: 1px solid var(--border2); color: var(--muted); border-radius: 10px; padding: 10px; font-size: 12px; cursor: pointer; }
  .btn-backup:active { opacity: 0.7; }

  .hidden { display: none; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--green); color: #0d0d17; font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept=".json" class="hidden">

<script>
// ── Datos de categorías ──────────────────────────────────────────
const FIJOS = [
  { id: "vivienda",       label: "Vivienda",       icon: "🏠", color: "#e8534a" },
  { id: "alimentacion",   label: "Alimentación",   icon: "🛒", color: "#e8a23a" },
  { id: "transporte",     label: "Transporte",     icon: "🚌", color: "#4a9ee8" },
  { id: "salud",          label: "Salud",          icon: "💊", color: "#4ac49e" },
  { id: "suscripciones",  label: "Suscripciones",  icon: "📱", color: "#9b6ee8" },
  { id: "educacion",      label: "Educación",      icon: "📚", color: "#e86ea0" },
  { id: "otros_fijos",    label: "Otros fijos",    icon: "📌", color: "#6e8fe8" },
];
const NO_ES = [
  { id: "ocio",           label: "Ocio",           icon: "🎮", color: "#f59e42" },
  { id: "ropa",           label: "Ropa",           icon: "👕", color: "#e87a4a" },
  { id: "restaurantes",   label: "Restaurantes",   icon: "🍽️", color: "#e8cf4a" },
  { id: "viajes",         label: "Viajes",         icon: "✈️", color: "#4ac4e8" },
  { id: "caprichos",      label: "Caprichos",      icon: "✨", color: "#c44ae8" },
];

// ── Utilidades ───────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n || 0);
const pct = (p, t) => t > 0 ? Math.round((p / t) * 100) : 0;
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  children.forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Estado global ────────────────────────────────────────────────
let STATE = {
  paso: 0,
  sueldo: '',
  gastosFijos: {},
  gastosNoEs: {},
  extrasF: [],   // [{id,nombre,importe,categoria}]
  extrasNE: [],
  tab: 'resumen',
  extraFForm: { nombre: '', importe: '', categoria: 'otros_fijos' },
  extraNEForm: { nombre: '', importe: '', categoria: 'ocio' },
};
let DATOS = null; // datos guardados (onboarding terminado)

function loadStorage() {
  try {
    const raw = localStorage.getItem('gastos_v2');
    if (raw) DATOS = JSON.parse(raw);
  } catch(e) {}
}
function saveStorage() {
  localStorage.setItem('gastos_v2', JSON.stringify(DATOS));
}

// ── Render principal ─────────────────────────────────────────────
function render() {
  const app = $('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  if (DATOS) {
    app.appendChild(renderDashboard());
  } else {
    app.appendChild(renderOnboarding());
  }
}

// ── Topbar ───────────────────────────────────────────────────────
function renderTopbar() {
  const wrap = el('div', { class: 'topbar' },
    el('div', { class: 'topbar-logo' }, '💳'),
    el('div', {},
      el('div', { class: 'topbar-name' }, 'Gastos'),
      el('div', { class: 'topbar-sub' }, 'CONTROL FINANCIERO')
    ),
    el('div', { class: 'topbar-spacer' })
  );
  if (DATOS) {
    const btn = el('button', { class: 'btn-small', onClick: () => { DATOS = null; STATE.paso = 0; render(); } }, '✏️ Editar');
    wrap.appendChild(btn);
  }
  return wrap;
}

// ═══════════════════════════════════════════════════════════════
// ONBOARDING
// ═══════════════════════════════════════════════════════════════
function renderOnboarding() {
  const wrap = el('div', { class: 'onboard' });

  // Progress dots
  const dots = el('div', { class: 'step-dots' });
  for (let i = 0; i < 3; i++) {
    dots.appendChild(el('div', { class: 'step-dot' + (i <= STATE.paso ? ' active' : '') }));
  }
  wrap.appendChild(el('div', { style: 'font-size:10px;color:var(--dim);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px' }, `Paso ${STATE.paso + 1} de 3`));
  wrap.appendChild(dots);

  const titles = ['¿Cuánto cobras al mes?', 'Gastos obligatorios', 'Gastos no esenciales'];
  const subs = ['Tu sueldo neto mensual aproximado.', 'Los que tienes sí o sí cada mes.', 'Los que podrías recortar si fuera necesario.'];
  wrap.appendChild(el('div', { class: 'step-title' }, titles[STATE.paso]));
  wrap.appendChild(el('div', { class: 'step-sub' }, subs[STATE.paso]));

  if (STATE.paso === 0) wrap.appendChild(renderPaso0());
  if (STATE.paso === 1) wrap.appendChild(renderPaso1());
  if (STATE.paso === 2) wrap.appendChild(renderPaso2());

  // Navegación
  const nav = el('div', { class: 'nav-row' });
  if (STATE.paso > 0) {
    nav.appendChild(el('button', { class: 'btn-back', onClick: () => { STATE.paso--; render(); } }, '← Atrás'));
  }
  const btnNext = el('button', {
    class: 'btn-next',
    onClick: () => {
      if (STATE.paso < 2) { STATE.paso++; render(); }
      else { finalizarOnboarding(); }
    }
  }, STATE.paso < 2 ? 'Continuar →' : 'Ver mi resumen 🎯');
  if (STATE.paso === 0 && !STATE.sueldo) btnNext.disabled = true;
  nav.appendChild(btnNext);
  wrap.appendChild(nav);

  return wrap;
}

function inputEuros(label, value, onChange) {
  const wrap = el('div', { class: 'field' },
    el('label', {}, label),
    el('div', { class: 'input-wrap' },
      el('span', { class: 'input-euro' }, '€'),
      (() => {
        const inp = el('input', { type: 'number', min: '0', step: '0.01', placeholder: '0', value });
        inp.addEventListener('input', e => onChange(e.target.value));
        return inp;
      })()
    )
  );
  return wrap;
}

function renderPaso0() {
  return inputEuros('Sueldo neto mensual', STATE.sueldo, v => { STATE.sueldo = v; $('btn-next-0') && ($('btn-next-0').disabled = !v); const btn = document.querySelector('.btn-next'); if(btn) btn.disabled = !v; });
}

function renderPaso1() {
  const wrap = el('div', {});
  FIJOS.forEach(cat => {
    wrap.appendChild(inputEuros(`${cat.icon} ${cat.label}`, STATE.gastosFijos[cat.id] || '', v => STATE.gastosFijos[cat.id] = v));
  });
  wrap.appendChild(renderExtraForm('F'));
  return wrap;
}

function renderPaso2() {
  const wrap = el('div', {});
  NO_ES.forEach(cat => {
    wrap.appendChild(inputEuros(`${cat.icon} ${cat.label}`, STATE.gastosNoEs[cat.id] || '', v => STATE.gastosNoEs[cat.id] = v));
  });
  wrap.appendChild(renderExtraForm('NE'));
  return wrap;
}

function renderExtraForm(tipo) {
  const esFijo = tipo === 'F';
  const form = esFijo ? STATE.extraFForm : STATE.extraNEForm;
  const lista = esFijo ? STATE.extrasF : STATE.extrasNE;
  const cats = esFijo ? FIJOS : NO_ES;

  const wrap = el('div', { class: 'section-divider' });
  wrap.appendChild(el('div', { class: 'section-label' }, '+ Gasto personalizado'));

  const nomInp = el('input', { type: 'text', class: 'plain-input', placeholder: esFijo ? 'Nombre (ej: préstamo coche)' : 'Nombre (ej: suscripción juego)', value: form.nombre, style: 'margin-bottom:8px' });
  nomInp.addEventListener('input', e => form.nombre = e.target.value);
  wrap.appendChild(nomInp);

  const row = el('div', { class: 'extra-row' });
  const impInp = el('input', { type: 'number', class: 'plain-input', placeholder: 'Importe €', value: form.importe });
  impInp.addEventListener('input', e => form.importe = e.target.value);
  row.appendChild(impInp);

  const sel = el('select', { class: 'plain-input' });
  cats.forEach(c => {
    const opt = el('option', { value: c.id }, `${c.icon} ${c.label}`);
    if (c.id === form.categoria) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => form.categoria = e.target.value);
  row.appendChild(sel);
  wrap.appendChild(row);

  const btnAdd = el('button', { class: 'btn-add-extra', onClick: () => {
    if (!form.nombre || !form.importe) return;
    lista.push({ id: Date.now(), nombre: form.nombre, importe: form.importe, categoria: form.categoria });
    form.nombre = ''; form.importe = '';
    render();
  }}, '＋ Añadir gasto');
  wrap.appendChild(btnAdd);

  lista.forEach(g => {
    const cat = cats.find(c => c.id === g.categoria);
    const chip = el('div', { class: 'chip' },
      el('div', {},
        el('span', { class: 'chip-name' }, g.nombre),
        el('span', { class: 'chip-cat' }, `${cat?.icon || '📎'} ${cat?.label || g.categoria}`)
      ),
      el('div', { class: 'chip-right' },
        el('span', { class: 'chip-amount' }, fmt(g.importe)),
        el('button', { class: 'chip-del', onClick: () => {
          if (esFijo) STATE.extrasF = STATE.extrasF.filter(x => x.id !== g.id);
          else STATE.extrasNE = STATE.extrasNE.filter(x => x.id !== g.id);
          render();
        }}, '×')
      )
    );
    wrap.appendChild(chip);
  });

  return wrap;
}

function finalizarOnboarding() {
  DATOS = {
    sueldo: parseFloat(STATE.sueldo) || 0,
    gastosFijos: { ...STATE.gastosFijos },
    gastosNoEs: { ...STATE.gastosNoEs },
    extrasF: [...STATE.extrasF],
    extrasNE: [...STATE.extrasNE],
  };
  saveStorage();
  render();
}

// ═══════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════
function calcTotales() {
  const d = DATOS;
  const totalF = FIJOS.reduce((s, c) => s + (parseFloat(d.gastosFijos[c.id]) || 0), 0)
                + d.extrasF.reduce((s, g) => s + (parseFloat(g.importe) || 0), 0);
  const totalNE = NO_ES.reduce((s, c) => s + (parseFloat(d.gastosNoEs[c.id]) || 0), 0)
                 + d.extrasNE.reduce((s, g) => s + (parseFloat(g.importe) || 0), 0);
  const totalG = totalF + totalNE;
  const rest = d.sueldo - totalG;
  return { totalF, totalNE, totalG, rest };
}

function renderDashboard() {
  const { totalF, totalNE, totalG, rest } = calcTotales();
  const sueldo = DATOS.sueldo;
  const safeColor = rest >= 0 ? 'var(--green)' : 'var(--red)';

  const wrap = el('div', { class: 'dash' });

  // Balance
  const balBlock = el('div', { class: 'balance-block' });
  balBlock.appendChild(el('div', { class: 'balance-label' }, 'Balance mensual'));
  balBlock.appendChild(el('div', { class: 'balance-amount', style: `color:${safeColor}` }, fmt(rest)));
  balBlock.appendChild(el('div', { class: 'balance-sub' }, `de ${fmt(sueldo)} totales`));
  wrap.appendChild(balBlock);

  // Cards
  const cards = el('div', { class: 'cards' });
  [
    { label: '📌 Gastos fijos',  valor: totalF,  color: 'var(--red)',    p: pct(totalF, sueldo) },
    { label: '✨ No esenciales', valor: totalNE, color: 'var(--orange)', p: pct(totalNE, sueldo) },
    { label: '💸 Total gastado', valor: totalG,  color: 'var(--purple)', p: pct(totalG, sueldo) },
    { label: '💰 Disponible',    valor: rest,    color: safeColor,       p: pct(Math.abs(rest), sueldo) },
  ].forEach(c => {
    cards.appendChild(el('div', { class: 'card' },
      el('div', { class: 'card-label' }, c.label),
      el('div', { class: 'card-amount', style: `color:${c.color}` }, fmt(c.valor)),
      el('div', { class: 'card-pct' }, `${c.p}% del sueldo`)
    ));
  });
  wrap.appendChild(cards);

  // Semáforo
  const pctG = pct(totalG, sueldo);
  let semMsg, semColor, semEmoji, semSub;
  if (pctG > 100) { semMsg = '¡Gastas más de lo que ingresas!'; semColor = 'var(--red)';    semEmoji = '🚨'; semSub = `Gastas el ${pctG}% de tus ingresos.`; }
  else if (pctG > 85) { semMsg = 'Margen muy ajustado, cuidado.';    semColor = 'var(--orange)'; semEmoji = '⚠️'; semSub = `Gastas el ${pctG}% de tus ingresos.`; }
  else if (pctG > 70) { semMsg = 'Razonable, pero hay margen.';       semColor = 'var(--yellow)'; semEmoji = '🟡'; semSub = `Gastas el ${pctG}% de tus ingresos.`; }
  else               { semMsg = '¡Buen control financiero!';          semColor = 'var(--green)';  semEmoji = '✅'; semSub = `Gastas el ${pctG}% de tus ingresos.`; }

  const sem = el('div', { class: 'semaforo', style: `border:1px solid ${semColor}33` },
    el('span', { class: 'semaforo-emoji' }, semEmoji),
    el('div', {},
      el('div', { class: 'semaforo-msg', style: `color:${semColor}` }, semMsg),
      el('div', { class: 'semaforo-sub' }, semSub)
    )
  );
  wrap.appendChild(sem);

  // Tabs
  const tabs = el('div', { class: 'tabs' });
  [['resumen','Resumen'],['fijos','Gastos fijos'],['variables','No esenciales']].forEach(([id, label]) => {
    const t = el('button', { class: 'tab' + (STATE.tab === id ? ' active' : ''), onClick: () => { STATE.tab = id; render(); } }, label);
    tabs.appendChild(t);
  });
  wrap.appendChild(tabs);

  // Contenido tabs
  if (STATE.tab === 'resumen') wrap.appendChild(renderTabResumen(totalF, totalNE, rest, sueldo));
  if (STATE.tab === 'fijos')   wrap.appendChild(renderTabFijos(totalF));
  if (STATE.tab === 'variables') wrap.appendChild(renderTabNoEs(totalNE));

  // Backup
  wrap.appendChild(renderBackup());

  return wrap;
}

function barra(label, valor, total, color, icon) {
  const p = Math.min(pct(valor, total || 1), 100);
  return el('div', { class: 'barra-item' },
    el('div', { class: 'barra-header' },
      el('span', {}, `${icon} ${label}`),
      el('span', { style: `color:${color}` }, `${fmt(valor)} · ${p}%`)
    ),
    el('div', { class: 'barra-track' },
      el('div', { class: 'barra-fill', style: `width:${p}%;background:${color}` })
    )
  );
}

function renderTabResumen(totalF, totalNE, rest, sueldo) {
  const wrap = el('div', {});
  wrap.appendChild(barra('Gastos fijos',   totalF,             sueldo, 'var(--red)',    '📌'));
  wrap.appendChild(barra('No esenciales',  totalNE,            sueldo, 'var(--orange)', '✨'));
  wrap.appendChild(barra('Disponible',     Math.max(rest, 0),  sueldo, 'var(--green)',  '💰'));

  wrap.appendChild(el('div', { class: 'regla-label' }, 'Regla 50/30/20 — Recomendado: 50% necesidades · 30% deseos · 20% ahorro'));
  const grid = el('div', { class: 'regla-grid' });
  [
    ['50%', pct(totalF, sueldo),            'var(--red)'],
    ['30%', pct(totalNE, sueldo),           'var(--orange)'],
    ['20%', pct(Math.max(rest,0), sueldo),  'var(--green)'],
  ].forEach(([rec, real, color]) => {
    grid.appendChild(el('div', { class: 'regla-cell' },
      el('div', { class: 'regla-rec' }, `Rec. ${rec}`),
      el('div', { class: 'regla-real', style: `color:${color}` }, `${real}%`)
    ));
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderTabFijos(totalF) {
  const wrap = el('div', {});
  let hay = false;
  FIJOS.forEach(cat => {
    const v = parseFloat(DATOS.gastosFijos[cat.id]) || 0;
    if (!v) return;
    wrap.appendChild(barra(cat.label, v, totalF || 1, cat.color, cat.icon));
    hay = true;
  });
  DATOS.extrasF.forEach(g => {
    const cat = FIJOS.find(c => c.id === g.categoria);
    const v = parseFloat(g.importe) || 0;
    if (!v) return;
    wrap.appendChild(barra(g.nombre, v, totalF || 1, cat?.color || '#888', cat?.icon || '📎'));
    hay = true;
  });
  if (!hay) wrap.appendChild(el('div', { class: 'empty-tab' }, 'No hay gastos fijos registrados.'));
  return wrap;
}

function renderTabNoEs(totalNE) {
  const wrap = el('div', {});
  let hay = false;
  NO_ES.forEach(cat => {
    const v = parseFloat(DATOS.gastosNoEs[cat.id]) || 0;
    if (!v) return;
    wrap.appendChild(barra(cat.label, v, totalNE || 1, cat.color, cat.icon));
    hay = true;
  });
  DATOS.extrasNE.forEach(g => {
    const cat = NO_ES.find(c => c.id === g.categoria);
    const v = parseFloat(g.importe) || 0;
    if (!v) return;
    wrap.appendChild(barra(g.nombre, v, totalNE || 1, cat?.color || '#888', cat?.icon || '✨'));
    hay = true;
  });
  if (!hay) wrap.appendChild(el('div', { class: 'empty-tab' }, 'No hay gastos variables registrados.'));
  return wrap;
}

// ── Backup / Restore ─────────────────────────────────────────────
function renderBackup() {
  const wrap = el('div', { class: 'backup-bar' });

  const btnExp = el('button', { class: 'btn-backup', onClick: exportarDatos }, '⬇️ Exportar datos');
  const btnImp = el('button', { class: 'btn-backup', onClick: () => $('import-file').click() }, '⬆️ Importar datos');

  wrap.appendChild(btnExp);
  wrap.appendChild(btnImp);
  return wrap;
}

function exportarDatos() {
  const json = JSON.stringify(DATOS, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gastos_backup.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ Backup exportado');
}

$('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      DATOS = JSON.parse(ev.target.result);
      saveStorage();
      render();
      toast('✅ Datos importados');
    } catch { toast('❌ Archivo inválido'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── Init ─────────────────────────────────────────────────────────
loadStorage();
render();
</script>
</body>
</html>
